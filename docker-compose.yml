services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      DOCS_DIR: data/documents
      STORAGE_DIR: storage
    volumes:
      - ./data/documents:/app/data/documents
      - ./storage:/app/storage
